<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Nova." />
    <title>Contact — Nova</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="orb orb-two"></div>
    <header class="site-header container">
      <a class="brand" href="index.html" aria-label="Nova home">nova<span>.</span></a>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a class="active" href="contact.html">Contact</a>
        <a href="coming-soon.html">Coming soon</a>
      </nav>
    </header>

    <main class="container page-content contact-layout">
      <div>
        <p class="eyebrow">Get in touch</p>
        <h1>Start a<br /><em>conversation.</em></h1>
        <p class="lead">Have an idea, a question, or just want to say hello? My inbox is open.</p>
      </div>
      <form class="contact-form" action="#" method="post">
        <label>Name<input type="text" name="name" placeholder="Your name" /></label>
        <label>Email<input type="email" name="email" placeholder="you@example.com" /></label>
        <label>Message<textarea name="message" rows="4" placeholder="What’s on your mind?"></textarea></label>
        <button class="button" type="submit">Send message <span aria-hidden="true">→</span></button>
      </form>
    </main>

    <footer class="container site-footer">© 2026 Nova Studio</footer>
  </body>
</html>
